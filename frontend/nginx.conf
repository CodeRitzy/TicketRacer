# One origin for the browser: static SPA plus /api proxied to the Go service (never published itself).

# Reuse upstream connections. Without a keepalive pool nginx opens one TCP connection per request
# and a sustained load test exhausts ephemeral ports (connect() failed: Address not available).
upstream api_upstream {
  server api:8081;
  keepalive 128;
}

# each live seat stream holds two nginx connections; cap streams per client IP
limit_conn_zone $binary_remote_addr zone=sse_per_ip:10m;
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

  client_max_body_size 1m;

  # live seat stream: no buffering, long-lived
  location = /api/seats/stream {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 1h;
    limit_conn sse_per_ip 8;
    limit_conn_status 429;
  }

  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # the API trusts X-Real-IP for per-IP rate limits; set it here, never pass the client's own
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  # hashed build assets can be cached forever. No add_header here: a location with its own
  # add_header drops the server-level security headers. `expires` sets Cache-Control on its own.
  location /assets/ {
    expires 1y;
  }

  # client-side routes (/seats, /confirmation, /dashboard...) all load the SPA
  location / {
    try_files $uri /index.html;
  }
}
